<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-Fit Sports - 장애인 체육시설 통합 플랫폼</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Kakao Maps SDK (정적 표준 로드 방식) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c5fcde2a37955d200e85806d94a2a4a4&libraries=services"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 상단 네비게이션 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2 cursor-pointer">
                <span class="text-2xl font-black text-blue-600">All-Fit</span>
                <span class="text-sm font-semibold text-slate-500">배리어프리 체육시설 통합 플랫폼</span>
            </div>
            <div class="text-xs text-slate-500 bg-blue-50 text-blue-600 px-3 py-1.5 rounded-full font-medium">
                🟢 공공데이터 실시간 연동중
            </div>
        </div>
    </header>

    <!-- 메인 대시보드 콘텐츠 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 space-y-6">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900">전국 장애인 체육시설 찾기</h1>
                <p class="text-sm text-slate-500 mt-1">대한장애인체육회 공공데이터와 카카오맵을 연동하여 전국의 배리어프리 체육시설을 안내합니다.</p>
            </div>
            <div class="flex items-center gap-2 w-full md:w-auto">
                <select id="regionFilter" onchange="filterFacilities()" class="border border-slate-300 rounded-xl px-4 py-2.5 text-sm bg-white font-medium focus:outline-none focus:border-blue-500 w-full md:w-48">
                    <option value="">전체 지역 보기</option>
                    <option value="서울">서울특별시</option>
                    <option value="경기">경기도</option>
                    <option value="부산">부산광역시</option>
                    <option value="인천">인천광역시</option>
                    <option value="대구">대구광역시</option>
                    <option value="대전">대전광역시</option>
                    <option value="광주">광주광역시</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden h-[600px] relative">
                <div id="map" class="w-full h-full"></div>
            </div>
            
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 h-[600px] flex flex-col">
                <div class="mb-3 pb-2 border-b border-slate-100 flex justify-between items-center">
                    <span class="text-sm font-bold text-slate-700">검색된 시설 목록</span>
                    <span id="facilityCount" class="text-xs text-blue-600 font-semibold bg-blue-50 px-2 py-0.5 rounded">불러오는 중...</span>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 pr-1" id="facilityList">
                    <div class="text-center text-slate-400 py-32">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto mb-3"></div>
                        공공데이터와 지도를 불러오는 중입니다...
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400 mt-8">
        &copy; 2026 All-Fit Sports. All rights reserved.
    </footer>

    <!-- 자바스크립트 로직 -->
    <script>
        let map = null;
        let markers = [];
        let facilitiesData = [];

        // 페이지 로드 시 카카오맵 객체 검증 후 즉시 초기화
        window.onload = function() {
            if (typeof kakao !== 'undefined' && kakao.maps) {
                initMap();
            } else {
                // 스크립트 로딩 대기
                setTimeout(() => {
                    if (typeof kakao !== 'undefined' && kakao.maps) {
                        initMap();
                    } else {
                        document.getElementById('facilityList').innerHTML = '<div class="text-center text-red-400 py-16">카카오맵 로드 실패<br>카카오 디벨로퍼스 도메인 설정을 다시 확인해주세요.</div>';
                    }
                }, 1000);
            }
        };

        function initMap() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(37.566826, 126.978656),
                level: 7
            };
            map = new kakao.maps.Map(container, options);
            fetchFacilitiesData();
        }

        async function fetchFacilitiesData() {
            try {
                const response = await fetch('/api/facilities');
                const result = await response.json();
                
                if (result && result.data) {
                    const geocoder = new kakao.maps.services.Geocoder();
                    const targetData = result.data.slice(0, 40);

                    targetData.forEach((item, index) => {
                        const address = item.소재지;
                        const name = item.시설명;
                        
                        if (!address) return;

                        geocoder.addressSearch(address, function(status, data) {
                            if (status === kakao.maps.services.Status.OK) {
                                const lat = data[0].y;
                                const lng = data[0].x;

                                facilitiesData.push({
                                    id: index + 1,
                                    name: name,
                                    region: item.시_도 || "기타",
                                    address: address,
                                    lat: parseFloat(lat),
                                    lng: parseFloat(lng),
                                    phone: item.전화번호 || "번호 없음",
                                    voucher: item.장애인스포츠강좌바우처시설 || "N",
                                    bandabi: item.반다비시설 || "N"
                                });

                                renderFacilities();
                            }
                        });
                    });
                }
            } catch (e) {
                console.error("데이터 로드 실패:", e);
                document.getElementById('facilityList').innerHTML = '<div class="text-center text-red-400 py-16">데이터를 불러오지 못했습니다.</div>';
            }
        }

        function renderFacilities(filterRegion = "") {
            const listContainer = document.getElementById('facilityList');
            listContainer.innerHTML = '';

            markers.forEach(marker => marker.setMap(null));
            markers = [];

            const filteredData = filterRegion 
                ? facilitiesData.filter(f => f.region.includes(filterRegion))
                : facilitiesData;

            document.getElementById('facilityCount').innerText = `${filteredData.length}개소`;

            if (filteredData.length === 0) {
                listContainer.innerHTML = '<div class="text-center text-slate-400 py-16">조건에 맞는 시설이 없습니다.</div>';
                return;
            }

            const bounds = new kakao.maps.LatLngBounds();

            filteredData.forEach(facility => {
                const card = document.createElement('div');
                card.className = "p-4 border border-slate-100 rounded-xl hover:bg-blue-50/50 hover:border-blue-200 transition cursor-pointer shadow-sm bg-white";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <h3 class="font-bold text-slate-800 text-sm">${facility.name}</h3>
                        <span class="text-[11px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-medium">${facility.region}</span>
                    </div>
                    <p class="text-xs text-slate-500 mb-2">${facility.address}</p>
                    <div class="flex gap-3 text-[11px] text-slate-400 font-medium">
                        <span>📞 ${facility.phone}</span>
                        <span>바우처: ${facility.voucher}</span>
                    </div>
                `;
                
                card.onclick = () => {
                    const moveLatLon = new kakao.maps.LatLng(facility.lat, facility.lng);
                    map.setCenter(moveLatLon);
                    map.setLevel(3);
                };
                listContainer.appendChild(card);

                const markerPosition = new kakao.maps.LatLng(facility.lat, facility.lng);
                const marker = new kakao.maps.Marker({ position: markerPosition });
                marker.setMap(map);
                markers.push(marker);

                bounds.extend(markerPosition);
            });

            if (filteredData.length > 0) {
                map.setBounds(bounds);
            }
        }

        function filterFacilities() {
            const selectedRegion = document.getElementById('regionFilter').value;
            renderFacilities(selectedRegion);
        }
    </script>
</body>
</html>
