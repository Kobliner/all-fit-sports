            { name: "부산사직어울림체육관", region: "부산", subRegion: "부산광역시 동래구 사직로 55", agency: "부산시설공단", lat: 35.1901, lng: 129.0611, phone: "051-860-7800", voucher: "Y", bandabi: "Y", sports: ["수영", "다목적체육관"], homepage: "https://www.bisco.or.kr" },

            { name: "대구광역시장애인국민체육센터", region: "대구", subRegion: "대구광역시 북구 호국로 225", agency: "대구광역시장애인체육회", lat: 35.9123, lng: 128.6111, phone: "053-383-8030", voucher: "Y", bandabi: "Y", sports: ["다목적체육관", "구기종목"], homepage: "" },

            { name: "광주빛고을국민체육센터", region: "광주", subRegion: "광주광역시 서구 화운로 290", agency: "광주광역시장애인체육회", lat: 35.1595, lng: 126.8526, phone: "062-600-3800", voucher: "Y", bandabi: "Y", sports: ["수영", "재활스포츠", "다목적체육관"], homepage: "" },

            { name: "충청북도장애인체육관", region: "충북", subRegion: "청주시 청원구 사뜸로 103", agency: "충청북도장애인체육회", lat: 36.6500, lng: 127.4833, phone: "043-298-8000", voucher: "Y", bandabi: "N", sports: ["다목적체육관", "구기종목"], homepage: "" },
            { name: "충남남부장애인국민체육센터", region: "충남", subRegion: "공주시 반포면 구룡사로 31", agency: "충청남도", lat: 36.4500, lng: 127.2000, phone: "041-850-8000", voucher: "Y", bandabi: "Y", sports: ["수영", "다목적체육관"], homepage: "" },
            { name: "전북장애인국민체육센터", region: "전북", subRegion: "전주시 덕진구 기린대로 1055", agency: "전라북도장애인체육회", lat: 35.8425, lng: 127.1292, phone: "063-251-8000", voucher: "Y", bandabi: "Y", sports: ["수영", "헬스/피트니스", "재활스포츠"], homepage: "" },
            { name: "전남장애인국민체육센터", region: "전남", subRegion: "목포시 영산로 696", agency: "전라남도장애인체육회", lat: 34.8111, lng: 126.3922, phone: "061-287-8000", voucher: "Y", bandabi: "Y", sports: ["수영", "다목적체육관"], homepage: "" },
            { name: "경상북도장애인체육관", region: "경북", subRegion: "안동시 앙실로 11", agency: "경상북도장애인체육회", lat: 36.5683, lng: 128.7294, phone: "054-850-8000", voucher: "Y", bandabi: "N", sports: ["다목적체육관", "구기종목"], homepage: "" },
            { name: "경남 양산반다비체육센터", region: "경남", subRegion: "양산시 물금읍 범어리", agency: "양산시시설관리공단", lat: 35.3350, lng: 129.0120, phone: "055-379-8000", voucher: "Y", bandabi: "Y", sports: ["수영", "헬스/피트니스", "다목적체육관"], homepage: "" },
            { name: "제주랑데뷰장애인체육센터", region: "제주", subRegion: "제주시 애월읍 상가로", agency: "제주특별자치도장애인체육회", lat: 33.4500, lng: 126.4333, phone: "064-753-8000", voucher: "Y", bandabi: "Y", sports: ["수영", "재활스포츠"], homepage: "" }
        ];

        window.onload = function() {
            initMap();
        };

        function initMap() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(37.566826, 126.978656),
                level: 7
            };
            map = new kakao.maps.Map(container, options);
            infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });
            
            // 데이터 바인딩 실행
            loadFacilities();
        }

        function loadFacilities() {
            allFacilities = mockFacilities.map((item, index) => ({
                id: index + 1,
                ...item
            }));
            filterAndRender();
        }

        function filterAndRender() {
            const regionVal = document.getElementById('regionFilter').value;
            const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
            const voucherVal = document.getElementById('voucherFilter').value;
            const bandabiVal = document.getElementById('bandabiFilter').value;

            const filtered = allFacilities.filter(f => {
                const matchRegion = regionVal ? f.region.includes(regionVal) : true;
                const matchSearch = searchVal ? f.name.toLowerCase().includes(searchVal) || f.subRegion.toLowerCase().includes(searchVal) || f.sports.some(s => s.toLowerCase().includes(searchVal)) : true;
                const matchVoucher = voucherVal ? f.voucher === voucherVal : true;
                const matchBandabi = bandabiVal ? f.bandabi === bandabiVal : true;
                return matchRegion && matchSearch && matchVoucher && matchBandabi;
            });

            document.getElementById('facilityCount').innerText = `검색 결과: ${filtered.length}개소 (전체 ${allFacilities.length}개 연동)`;
            renderListAndMarkers(filtered);
        }

        function renderListAndMarkers(list) {
            const listContainer = document.getElementById('facilityList');
            listContainer.innerHTML = '';

            markers.forEach(marker => marker.setMap(null));
            markers = [];

            if (list.length === 0) {
                listContainer.innerHTML = '<div class="text-center text-slate-400 py-24 text-sm font-medium">조건에 일치하는 체육시설이 없습니다.</div>';
                return;
            }

            const bounds = new kakao.maps.LatLngBounds();

            list.forEach(facility => {
                const card = document.createElement('div');
                card.className = "p-4 border border-slate-100 rounded-xl hover:bg-blue-50/60 hover:border-blue-200 transition cursor-pointer shadow-sm bg-white space-y-2";
                
                let badges = `<span class="text-[10px] bg-slate-100 text-slate-700 px-2 py-0.5 rounded-md font-bold">${facility.region}</span>`;
                if (facility.voucher === 'Y') {
                    badges += `<span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-md font-bold">스포츠 바우처</span>`;
                }
                if (facility.bandabi === 'Y') {
                    badges += `<span class="text-[10px] bg-purple-100 text-purple-800 px-2 py-0.5 rounded-md font-bold">반다비 센터</span>`;
                }
                facility.sports.forEach(sport => {
                    badges += `<span class="text-[10px] bg-blue-50 text-blue-700 px-2 py-0.5 rounded-md font-semibold">${sport}</span>`;
                });

                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2">
                        <h3 class="font-bold text-slate-800 text-sm leading-snug">${facility.name}</h3>
                    </div>
                    <div class="flex flex-wrap gap-1 pt-0.5">${badges}</div>
                    <p class="text-xs text-slate-500 pt-1">${facility.subRegion} (${facility.agency})</p>
                    <div class="flex items-center justify-between text-[11px] text-slate-400 pt-1 border-t border-slate-50">
                        <span>📞 ${facility.phone}</span>
                        <span class="text-blue-600 font-medium">상세보기 &rarr;</span>
                    </div>
                `;
                
                card.addEventListener('click', function() {
                    const moveLatLon = new kakao.maps.LatLng(facility.lat, facility.lng);
                    map.setCenter(moveLatLon);
                    map.setLevel(3);
                    openModal(facility);
                });

                listContainer.appendChild(card);

                const markerPosition = new kakao.maps.LatLng(facility.lat, facility.lng);
                const marker = new kakao.maps.Marker({ position: markerPosition });
                marker.setMap(map);

                kakao.maps.event.addListener(marker, 'click', function() {
                    infowindow.setContent(`<div style="padding:8px 12px;font-size:12px;font-weight:bold;color:#1e293b;">${facility.name}</div>`);
                    infowindow.open(map, marker);
                    openModal(facility);
                });

                markers.push(marker);
                bounds.extend(markerPosition);
            });

            if (list.length > 0) {
                map.setBounds(bounds);
            }
        }

        function openModal(facility) {
            document.getElementById('modalTitle').innerText = facility.name;
            document.getElementById('modalRegion').innerText = facility.subRegion;
            document.getElementById('modalAgency').innerText = facility.agency;
            document.getElementById('modalPhone').innerText = facility.phone;
            
            const hpContainer = document.getElementById('modalHomepageContainer');
            const hpEl = document.getElementById('modalHomepage');
            if (facility.homepage) {
                hpEl.href = facility.homepage;
                hpEl.innerText = facility.homepage;
                hpContainer.style.display = 'flex';
            } else {
                hpContainer.style.display = 'none';
            }

            let badgeHtml = `<span class="text-xs bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg font-bold">${facility.region}</span>`;
            if (facility.voucher === 'Y') {
                badgeHtml += `<span class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-lg font-bold">스포츠 바우처 지정</span>`;
            }
            if (facility.bandabi === 'Y') {
                badgeHtml += `<span class="text-xs bg-purple-100 text-purple-800 px-2.5 py-1 rounded-lg font-bold">반다비 센터</span>`;
            }
            facility.sports.forEach(sport => {
                badgeHtml += `<span class="text-xs bg-blue-50 text-blue-700 px-2.5 py-1 rounded-lg font-semibold">${sport}</span>`;
            });
            document.getElementById('modalBadges').innerHTML = badgeHtml;

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }
    </script>
</body>
</html>
